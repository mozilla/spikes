[project]
name = "spikes"
version = "0.1.0"
description = "Detect spikes in crash data coming from Socorro"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "authlib>=1.9",
    "flask>=3.1",
    "flask-cors>=6.0",
    "flask-sqlalchemy>=3.1",
    "gunicorn>=26.0",
    "inflect>=7.6",
    "jinja2>=3.1",
    "libmozdata>=0.2.20",
    "numpy>=2.5",
    "psycopg[binary]>=3.3",
    "python-dateutil>=3.0",
    "scipy>=1.18",
    "sqlalchemy>=2.1",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.11",
]

[dependency-groups]
dev = [
    "coverage>=7.17",
    "ruff>=0.17",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# Same checks as the flake8 setup this replaced (pycodestyle + pyflakes).
select = ["E", "F", "W"]

[tool.coverage.run]
source = ["spikes"]
