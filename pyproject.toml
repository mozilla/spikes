[project]
name = "spikes"
version = "0.1.0"
description = "Detect spikes in crash data coming from Socorro"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.13"
dependencies = [
    "apscheduler>=3.11,<4",
    "flask>=3.1",
    "flask-cors>=6.0",
    "flask-sqlalchemy>=3.1",
    "gunicorn>=23.0",
    "inflect>=7.5",
    "jinja2>=3.1",
    "libmozdata>=0.2.18",
    "numpy>=2.3",
    "psycopg2-binary>=2.9.12",
    "python-dateutil>=2.9",
    "scipy>=1.16",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
plot = [
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "coverage>=7.10",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# Same checks as the flake8 setup this replaced (pycodestyle + pyflakes).
select = ["E", "F", "W"]

[tool.coverage.run]
source = ["spikes"]
