<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Crash spikes</title>
<link id="favicon" rel="icon" href="{{ url_for('dashboard.static', filename='favicon.png') }}">
<link rel="stylesheet" href="{{ url_for('dashboard.static', filename='dashboard.css') }}">
<link rel="modulepreload" href="{{ url_for('dashboard.static', filename='charts.js') }}">
<link rel="modulepreload" href="{{ url_for('dashboard.static', filename='icons.js') }}">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="toolbar" class="toolbar">
  <header class="page-header">
    <div class="header-row">
      <div class="brand-row">
        <a href="https://www.mozilla.org/" class="brand" aria-label="Mozilla">mozilla</a>
        <h1><a class="dashboard-link" href="https://crash-spikes.herokuapp.com/dashboard.html#all">Crash spikes</a></h1>
        <button type="button" id="help-btn" class="help-btn" aria-label="How the thresholds are computed" title="Thresholds: what they are, how they are computed">?</button>
      </div>
      <div class="header-right">
        <div id="scope-controls" class="seg scope-seg" role="group" aria-label="Versions" hidden>
          <label title="Only the version current on each day: 155.x, 156.0bN"><input type="radio" name="scope" value="current" checked><span>Current version</span></label>
          <label title="Only the exact version current on each day: 155.0.1, 156.0b3 (nothing from b2); on nightly the day's builds"><input type="radio" name="scope" value="strict"><span>Strict version</span></label>
          <label title="Every version reporting on the channel"><input type="radio" name="scope" value="all"><span>All versions</span></label>
        </div>
        <p id="freshness" class="freshness"></p>
        <a href="https://github.com/mozilla/spikes" class="github-link" title="Source on GitHub" aria-label="Source on GitHub (opens in a new tab)" target="_blank" rel="noopener">
          <svg viewBox="0 0 16 16" width="28" height="28" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        </a>
        <div id="account" class="account" hidden></div>
      </div>
    </div>
    <p id="error-line" class="error-line" role="alert" hidden></p>
    <div id="banner" class="banner" role="status"></div>
    <div id="sr-status" class="visually-hidden" role="status"></div>
  </header>
  <section id="overview" aria-labelledby="overview-title">
    <h2 id="overview-title" class="visually-hidden">Channels</h2>
    <div id="channel-cards" class="cards"></div>
    <p id="empty-state" class="empty" hidden>No data yet — the first scheduler run is backfilling</p>
  </section>
</div>

<main id="main" tabindex="-1">

  <section id="flagged" aria-labelledby="flagged-title" hidden>
    <div class="section-head">
      <h2 id="flagged-title">All channels <span class="sub">flagged now</span></h2>
      <p id="flagged-meta" class="meta"></p>
    </div>
    <div id="alerts-table" class="table-wrap"></div>
  </section>

  <section id="detail" aria-labelledby="detail-title" hidden>
    <div class="section-head">
      <h2 id="detail-title"></h2>
      <p id="detail-meta" class="meta"></p>
    </div>
    <div id="tiles" class="tiles"></div>
    <p id="drivers" class="drivers" hidden></p>

    <form id="range-controls" class="filter-row" aria-label="Chart range">
      <span class="filter-label">Range</span>
      <div class="seg" role="group" aria-label="Days of history">
        <label><input type="radio" name="days" value="30"><span>30 d</span></label>
        <label><input type="radio" name="days" value="90" checked><span>90 d</span></label>
        <label><input type="radio" name="days" value="180"><span>180 d</span></label>
        <label id="range-all" hidden><input type="radio" name="days" value="730"><span>All</span></label>
      </div>
      <span class="filter-label">Granularity</span>
      <div class="seg" role="group" aria-label="Bucket size">
        <label><input type="radio" name="granularity" value="day" checked><span>Day</span></label>
        <label><input type="radio" name="granularity" value="week"><span>Week</span></label>
      </div>
    </form>

    <div class="charts">
      <div class="chart-card">
        <h3>Today by hour <span class="sub tz-label">UTC</span></h3>
        <div id="intraday-chart"></div>
      </div>
      <div class="chart-card">
        <h3>Daily crashes <span id="daily-sub" class="sub"></span></h3>
        <div id="daily-chart"></div>
      </div>
    </div>

    <details id="model-details" class="model">
      <summary>
        <span class="summary-title">How the expectation is built</span>
        <span id="model-summary" class="model-summary"></span>
      </summary>
      <div id="model-body" class="model-body"></div>
    </details>

    <div class="section-head">
      <h3 id="signatures-title">Signatures</h3>
      <p id="signatures-meta" class="meta" role="status"></p>
    </div>
    <form id="sig-filters" class="filter-row" aria-label="Signature filters">
      <div class="chip-toggles" role="group" aria-label="Severity">
        <label class="chip-toggle chip-major"><input type="checkbox" name="sev" value="major" checked><span>major</span></label>
        <label class="chip-toggle chip-spike"><input type="checkbox" name="sev" value="spike" checked><span>spike</span></label>
        <label class="chip-toggle chip-watch"><input type="checkbox" name="sev" value="watch" checked><span>watch</span></label>
        <label class="chip-toggle chip-drop"><input type="checkbox" name="sev" value="drop" checked><span>drop</span></label>
        <label class="chip-toggle chip-new"><input type="checkbox" name="sev" value="new" checked><span>new</span></label>
      </div>
      <input id="sig-search" name="query" type="search" placeholder="Filter signatures" aria-label="Filter signatures" autocomplete="off">
      <label class="check"><input type="checkbox" id="hide-noise" name="hide-noise" checked><span>hide noise</span></label>
      <label class="check">min crashes <input type="number" id="min-crashes" name="min-crashes" min="0" step="1" value="0" title="Minimum crashes observed today"></label>
      <label class="check"><input type="checkbox" id="show-storms" name="show-storms"><span>show <span id="storm-count">0 storms</span></span></label>
      <label class="check"><input type="checkbox" id="show-unflagged" name="show-unflagged"><span>show <span id="unflagged-count">0</span> unflagged</span></label>
    </form>
    <div id="signature-table" class="table-wrap"></div>
  </section>
</main>

<dialog id="help" class="help" aria-labelledby="help-title">
  <div class="help-head">
    <h2 id="help-title">Thresholds</h2>
    <button type="button" id="help-close" class="chart-btn" aria-label="Close">Close</button>
  </div>
  <div id="help-body" class="help-body"></div>
</dialog>

<script type="module" src="{{ url_for('dashboard.static', filename='dashboard.js') }}"></script>
</body>
</html>
